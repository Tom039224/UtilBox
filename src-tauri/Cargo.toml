[package]
name = "utilbox"
version = "0.1.0"
description = "Offline toolbox: universal file conversion, MP4 compression, YouTube download"
authors = ["UtilBox"]
edition = "2021"
rust-version = "1.77.2"
default-run = "utilbox"

[lib]
name = "utilbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
